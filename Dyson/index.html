<!doctype html>
<html class="page" lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=\, initial-scale=1.0" />
		<title>Dyson</title>
		<link rel="stylesheet" href="./css/index.css" />
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<button
					class="header__burger burger"
					aria-label="Открыть меню"
					aria-expanded="false"
					aria-controls="header__menu"
				>
					<svg width="50" height="50">
						<use
							class="header__ations-icon--menu"
							href="./icons/sprite.svg#burger"
						></use>
					</svg>
				</button>
				<a href="#" class="logo header__logo">
					<img
						src="./images/logo-icon.svg"
						width="183"
						height="77"
						alt="Логотип dyson"
					/>
				</a>
				<nav class="menu header__menu">
					<ul class="menu__list">
						<li class="menu__item"><a href="#" class="menu__link">О нас</a></li>
						<li class="menu__item">
							<a href="#" class="menu__link">Доставка и оплата</a>
						</li>
						<li class="menu__item">
							<a href="#" class="menu__link">Регистрация продукта</a>
						</li>
						<li class="menu__item">
							<a href="#" class="menu__link">Сервис</a>
						</li>
						<li class="menu__item">
							<a href="#" class="menu__link">Сертификаты и лицензии</a>
						</li>
					</ul>
				</nav>
				<div class="heder__controls">
					<div class="header__actions">
						<button
							class="header__actions-button"
							title="Корзина"
							aria-label="Корзина"
						>
							<svg width="36" height="36">
								<use
									class="header__ations-icon"
									href="./icons/sprite.svg#cart"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="banner">
				<div class="container banner__container">
					<h1 class="banner__title">Уникальные технологии <br> для ухода за волосами</h1>
					<p class="banner__description">Идеальная укладка для всех типов волос <br> вместе с Dyson</p>
					<picture>
						<img class="banner__img" src="./images/woman-dyson-1.png" alt="" />
					</picture>
				</div>
			</section>
		</main>
	</body>
</html>
